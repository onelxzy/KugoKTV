name: Android CI/CD - Build Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '17' # Gradle 8.x requires Java 17

    - name: Setup Gradle Cache
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build Release APK
      run: gradle assembleRelease
      working-directory: ./KugoKTV

    # Optional: Sign the Release APK if secrets are configured.
    # Otherwise, it falls back to the unsigned release APK or debug APK.
    - name: Sign Android Release APK
      id: sign_app
      uses: r0adrunner/sign-android-release@v1
      with:
        releaseDirectory: ./KugoKTV/app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      continue-on-error: true # Do not fail the build if the user hasn't configured signing secrets yet

    - name: Upload Unsigned / Signed APK Artifact
      uses: actions/upload-artifact@v3
      with:
        name: kugo-ktv-release-apk
        path: |
          ./KugoKTV/app/build/outputs/apk/release/*.apk
