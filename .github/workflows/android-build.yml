name: Android CI/CD - Build Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle Cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-

    - name: Build Release APK
      run: gradle assembleRelease
      working-directory: ./KugoKTV

    # Optional: Sign the Release APK if secrets are configured.
    # Otherwise, it falls back to the unsigned release APK.
    - name: Sign Android Release APK
      if: ${{ secrets.SIGNING_KEY != '' }}
      run: |
        echo "${{ secrets.SIGNING_KEY }}" | base64 -d > release.jks
        # Find the pre-installed apksigner in Android SDK
        APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
        # Find the built unsigned APK
        UNSIGNED_APK=$(find ./app/build/outputs/apk/release -name "*-unsigned.apk" | head -n 1)
        if [ -f "$UNSIGNED_APK" ]; then
          $APKSIGNER sign --ks release.jks --ks-key-alias "${{ secrets.ALIAS }}" --ks-pass pass:"${{ secrets.KEY_STORE_PASSWORD }}" --key-pass pass:"${{ secrets.KEY_PASSWORD }}" --out ./app/build/outputs/apk/release/KugoKTV-release-signed.apk "$UNSIGNED_APK"
          echo "Signed APK successfully created: ./app/build/outputs/apk/release/KugoKTV-release-signed.apk"
        else
          echo "No unsigned APK found to sign."
        fi
      working-directory: ./KugoKTV
      continue-on-error: true

    - name: Upload Unsigned / Signed APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kugo-ktv-release-apk
        path: |
          ./KugoKTV/app/build/outputs/apk/release/*.apk
