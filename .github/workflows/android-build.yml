name: Android CI/CD - Build Release APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allow manual trigger

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.4

    - name: Build Release APK
      run: gradle assembleRelease

    - name: Sign Android Release APK
      run: |
        # Find the pre-installed apksigner in Android SDK
        APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n 1)
        # Find the built unsigned APK
        UNSIGNED_APK=$(find ./app/build/outputs/apk/release -name "*-unsigned.apk" | head -n 1)
        
        if [ -n "${{ secrets.SIGNING_KEY }}" ]; then
          echo "Using configured GitHub Secrets for signing..."
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > release.jks
          KEY_ALIAS="${{ secrets.ALIAS }}"
          STORE_PASS="${{ secrets.KEY_STORE_PASSWORD }}"
          KEY_PASS="${{ secrets.KEY_PASSWORD }}"
        else
          echo "No secrets configured. Generating a self-signed release keystore on the fly..."
          keytool -genkey -v -keystore release.jks -alias ktv -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Echo KTV, OU=Echo, O=Echo, L=BJ, S=BJ, C=CN" -storepass 123456 -keypass 123456
          KEY_ALIAS="ktv"
          STORE_PASS="123456"
          KEY_PASS="123456"
        fi
        
        if [ -f "$UNSIGNED_APK" ]; then
          $APKSIGNER sign --ks release.jks --ks-key-alias "$KEY_ALIAS" --ks-pass pass:"$STORE_PASS" --key-pass pass:"$KEY_PASS" --out ./app/build/outputs/apk/release/KugoKTV-release-signed.apk "$UNSIGNED_APK"
          echo "Signed APK successfully created: ./app/build/outputs/apk/release/KugoKTV-release-signed.apk"
          # Delete the unsigned APK so the output zip only contains the signed one
          rm "$UNSIGNED_APK"
        else
          echo "No unsigned APK found to sign."
        fi
      continue-on-error: true

    - name: Upload Unsigned / Signed APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: kugo-ktv-release-apk
        path: |
          ./app/build/outputs/apk/release/*.apk
